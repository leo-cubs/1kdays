<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sow Calendar</title>
<meta name="description" content="Gregorian calendar and 1000-day pig production planner with configurable week start.">
<meta name="theme-color" content="#1c6e4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
  :root{
    --bg:#f2f4f1;
    --surface:#ffffff;
    --surface-2:#f7f8f6;
    --border:#dde2dc;
    --fg:#1a2420;
    --muted:#6b756e;
    --muted-2:#98a099;
    --accent:#1c6e4a;
    --accent-fg:#ffffff;
    --accent-soft:#e2f0e8;
    --amber:#c8781f;
    --today-ring:#c8781f;
    --danger:#b3432c;
    --shadow:0 1px 2px rgba(20,30,25,.06), 0 4px 16px rgba(20,30,25,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121712;
      --surface:#1a211b;
      --surface-2:#212a22;
      --border:#2c362d;
      --fg:#eef2ee;
      --muted:#9aa89e;
      --muted-2:#6c786f;
      --accent:#4caf7d;
      --accent-fg:#0d1510;
      --accent-soft:#1f3327;
      --amber:#e0a054;
      --today-ring:#e0a054;
      --danger:#e07a5f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121712;
    --surface:#1a211b;
    --surface-2:#212a22;
    --border:#2c362d;
    --fg:#eef2ee;
    --muted:#9aa89e;
    --muted-2:#6c786f;
    --accent:#4caf7d;
    --accent-fg:#0d1510;
    --accent-soft:#1f3327;
    --amber:#e0a054;
    --today-ring:#e0a054;
    --danger:#e07a5f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button, input, select{ font-family:inherit; color:inherit; }
  input, select{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 10px;
    font-size:14px;
  }
  button{
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:9px;
    padding:8px 12px;
    font-size:14px;
    font-weight:600;
    color:var(--fg);
  }
  button:active{ transform:translateY(1px); }
  button.primary{
    background:var(--accent);
    color:var(--accent-fg);
    border-color:var(--accent);
  }
  button.ghost{ background:transparent; border-color:transparent; }
  button.icon{ padding:8px; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; }

  .app{ max-width:960px; margin:0 auto; padding:16px 16px 48px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:16px;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-size:22px; font-weight:700; margin:0;
    display:flex; align-items:center; gap:8px;
  }
  header.top h1 .pig{ font-size:24px; }

  nav.tabs{
    display:flex; gap:6px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:11px; padding:4px;
  }
  nav.tabs button{
    border:none; background:transparent; border-radius:8px;
    padding:8px 14px; color:var(--muted); font-weight:600;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--fg); box-shadow:var(--shadow); }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:16px;
  }

  .settings-toggle{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .settings-body{ display:none; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .settings-body.open{ display:grid; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }

  /* Month view */
  .month-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-head .title{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; min-width:180px; text-align:center; }
  .month-head .navgrp{ display:flex; gap:6px; align-items:center; }

  .weekday-row, .month-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
  }
  .weekday-row{ margin-bottom:6px; }
  .weekday-row div{
    text-align:center; font-size:11px; font-weight:700; color:var(--muted-2);
    text-transform:uppercase; letter-spacing:.04em; padding:4px 0;
  }
  .day-cell{
    aspect-ratio:1/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; font-size:14px; font-weight:600;
    background:var(--surface-2); color:var(--fg);
    position:relative;
  }
  .day-cell.outside{ color:var(--muted-2); background:transparent; font-weight:500; }
  .day-cell.today{
    box-shadow:0 0 0 2px var(--today-ring) inset;
    color:var(--amber);
  }
  .day-cell.weekend{ color:var(--muted); }
  .day-cell.outside.weekend{ color:var(--muted-2); }

  /* Planner */
  .planner-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .planner-toolbar .navgrp{ display:flex; gap:6px; align-items:center; }
  .progress{
    font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .jump-form{ display:flex; gap:6px; align-items:center; }
  .jump-form input{ width:76px; }

  .week-row{
    display:grid; grid-template-columns:64px repeat(7,1fr); gap:6px; margin-bottom:6px;
  }
  .week-row .weeklabel{
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--muted-2); font-weight:700;
  }
  .planner-head{
    display:grid; grid-template-columns:64px repeat(7,1fr); gap:6px; margin-bottom:6px;
  }
  .planner-head div{
    text-align:center; font-size:11px; font-weight:700; color:var(--muted-2);
    text-transform:uppercase; letter-spacing:.04em; padding:2px 0;
  }

  .pcell{
    background:var(--surface-2);
    border-radius:10px;
    padding:6px 4px 5px;
    min-height:58px;
    display:flex; flex-direction:column; gap:3px;
    position:relative;
  }
  .pcell .daynum{ font-size:9px; font-weight:700; color:var(--muted-2); text-transform:uppercase; }
  .pcell .datenum{ font-size:14px; font-weight:700; line-height:1; }
  .pcell .monthtag{ font-size:9px; color:var(--muted); font-weight:600; }
  .pcell.today{ box-shadow:0 0 0 2px var(--today-ring) inset; }
  .pcell.today .datenum{ color:var(--amber); }
  .pcell.out-of-range{ opacity:.35; }

  .marks{ display:flex; flex-wrap:wrap; gap:2px; margin-top:auto; }
  .mark{
    font-size:8.5px; font-weight:800; color:#fff;
    border-radius:4px; padding:1px 3px; line-height:1.3;
  }

  .legend{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .batch-row{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:8px 10px; font-size:13px; flex-wrap:wrap;
  }
  .swatch{ width:12px; height:12px; border-radius:4px; flex:none; }
  .batch-row .label{ font-weight:700; flex:1 1 auto; min-width:80px; }
  .batch-row .dates{ color:var(--muted); font-size:12px; }
  .batch-row button{ margin-left:auto; }

  .add-batch{ display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-top:12px; }
  .add-batch .field{ min-width:120px; }
  .color-picks{ display:flex; gap:6px; }
  .color-pick{
    width:22px; height:22px; border-radius:6px; border:2px solid transparent; cursor:pointer;
  }
  .color-pick.selected{ border-color:var(--fg); }

  .key-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; }
  .key-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .key-legend i{ width:14px; height:14px; border-radius:4px; background:var(--muted-2); display:inline-block; font-style:normal; color:#fff; font-size:9px; font-weight:800; text-align:center; line-height:14px; }

  h2.section-title{ font-size:14px; font-weight:700; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  footer.hint{ text-align:center; color:var(--muted-2); font-size:12px; margin-top:20px; }

  @media (max-width:520px){
    .week-row, .planner-head{ grid-template-columns:34px repeat(7,1fr); gap:4px; }
    .pcell{ min-height:50px; padding:4px 2px; }
    .pcell .datenum{ font-size:12px; }
    .month-head .title{ min-width:0; font-size:17px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <h1><span class="pig">🐖</span> Sow Calendar</h1>
    <nav class="tabs" id="tabs">
      <button data-view="month" class="active">Calendar</button>
      <button data-view="planner">1000-Day Planner</button>
    </nav>
  </header>

  <!-- ===== Global settings ===== -->
  <div class="panel">
    <div class="settings-toggle">
      <button class="ghost icon" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="field">
        <label for="weekStartSel">Week starts on</label>
        <select id="weekStartSel">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>
      </div>
      <div class="field">
        <label for="themeSel">Theme</label>
        <select id="themeSel">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ===== Gregorian month view ===== -->
  <section id="view-month" class="panel">
    <div class="month-head">
      <button class="icon ghost" id="mPrev" aria-label="Previous month">‹</button>
      <div class="title" id="mTitle">Month Year</div>
      <div class="navgrp">
        <button id="mToday">Today</button>
        <button class="icon ghost" id="mNext" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="weekday-row" id="mWeekdays"></div>
    <div class="month-grid" id="mGrid"></div>
  </section>

  <!-- ===== 1000-day planner ===== -->
  <section id="view-planner" style="display:none;">

    <div class="panel">
      <div class="settings-toggle">
        <button class="ghost icon" id="plannerCfgBtn" title="Planner settings" aria-label="Planner settings">⚙️</button>
      </div>
      <div class="settings-body" id="plannerCfgBody">
        <div class="field">
          <label for="startDateInp">Day 1 (start date)</label>
          <input type="date" id="startDateInp">
        </div>
        <div class="field">
          <label for="totalDaysInp">Total days</label>
          <input type="number" id="totalDaysInp" min="100" max="1500" step="1">
        </div>
        <div class="field">
          <label for="gestationInp">Gestation (days)</label>
          <input type="number" id="gestationInp" min="90" max="130" step="1">
        </div>
        <div class="field">
          <label for="lactationInp">Lactation → weaning (days)</label>
          <input type="number" id="lactationInp" min="14" max="35" step="1">
        </div>
        <div class="field">
          <label for="wsiInp">Wean-to-service interval (days)</label>
          <input type="number" id="wsiInp" min="3" max="14" step="1">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Breeding batches</h2>
      <div class="legend" id="batchList"></div>
      <div class="add-batch">
        <div class="field">
          <label for="batchLabel">Label</label>
          <input type="text" id="batchLabel" placeholder="e.g. Group A" maxlength="24" style="width:140px;">
        </div>
        <div class="field">
          <label for="batchDate">First service date</label>
          <input type="date" id="batchDate">
        </div>
        <div class="field">
          <label>Color</label>
          <div class="color-picks" id="colorPicks"></div>
        </div>
        <button class="primary" id="addBatchBtn">Add batch</button>
      </div>
      <div class="key-legend">
        <span><i style="background:var(--accent)">S</i> Service / AI</span>
        <span><i style="background:var(--danger)">F</i> Farrowing (~term)</span>
        <span><i style="background:var(--amber)">W</i> Weaning</span>
      </div>
    </div>

    <div class="panel">
      <div class="planner-toolbar">
        <div class="navgrp">
          <button class="icon ghost" id="pPrev" aria-label="Previous page">‹</button>
          <button id="pToday">Jump to today</button>
          <button class="icon ghost" id="pNext" aria-label="Next page">›</button>
        </div>
        <div class="progress" id="pProgress"></div>
        <form class="jump-form" id="jumpForm">
          <label for="jumpInp" style="font-size:12px;color:var(--muted);">Day</label>
          <input type="number" id="jumpInp" min="1" step="1">
          <button type="submit">Go</button>
        </form>
      </div>
      <div class="planner-head" id="pWeekdays"></div>
      <div id="pGrid"></div>
    </div>

  </section>

  <footer class="hint">Settings are saved automatically in this browser.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  var LS_SETTINGS = "sowcal.settings.v1";
  var LS_BATCHES  = "sowcal.batches.v1";

  var DAYNAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHNAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTHSHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var COLORS = ["#1c6e4a","#c8781f","#2f6fa0","#8a4fb0","#b3432c","#3a8f8f","#a08a1c","#5a5fc7"];

  function defaultSettings(){
    return {
      weekStart: 1,          // Monday default
      theme: "system",
      startDate: isoDate(startOfYear(new Date())),
      totalDays: 1000,
      gestation: 114,
      lactation: 21,
      wsi: 5
    };
  }

  function loadSettings(){
    try{
      var raw = localStorage.getItem(LS_SETTINGS);
      if(!raw) return defaultSettings();
      var parsed = JSON.parse(raw);
      return Object.assign(defaultSettings(), parsed);
    }catch(e){ return defaultSettings(); }
  }
  function saveSettings(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings)); }

  function loadBatches(){
    try{
      var raw = localStorage.getItem(LS_BATCHES);
      if(!raw) return [];
      return JSON.parse(raw);
    }catch(e){ return []; }
  }
  function saveBatches(){ localStorage.setItem(LS_BATCHES, JSON.stringify(state.batches)); }

  /* ---------- date helpers (local time, no TZ surprises) ---------- */
  function d(y,m,day){ return new Date(y,m,day); }
  function startOfYear(dt){ return new Date(dt.getFullYear(),0,1); }
  function isoDate(dt){
    var y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,"0"), day=String(dt.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function parseISO(s){
    var parts = s.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(dt, n){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n); }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function daysBetween(a,b){ // b - a, in whole days
    var ta = new Date(a.getFullYear(),a.getMonth(),a.getDate()).getTime();
    var tb = new Date(b.getFullYear(),b.getMonth(),b.getDate()).getTime();
    return Math.round((tb-ta)/86400000);
  }
  function weekdayOffset(dowOfDate, weekStart){
    return (dowOfDate - weekStart + 7) % 7;
  }
  function orderedWeekdayLabels(weekStart){
    var out=[];
    for(var i=0;i<7;i++) out.push(DAYNAMES[(weekStart+i)%7]);
    return out;
  }

  /* ---------- state ---------- */
  var state = {
    view: "month",
    settings: loadSettings(),
    batches: loadBatches(),
    monthCursor: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    plannerPage: 0,
    weeksPerPage: 8
  };

  var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  /* ---------- theme ---------- */
  function applyTheme(){
    var t = state.settings.theme;
    if(t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  /* ---------- tabs ---------- */
  var tabsEl = document.getElementById("tabs");
  tabsEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-view]");
    if(!btn) return;
    state.view = btn.getAttribute("data-view");
    Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b===btn);
    });
    document.getElementById("view-month").style.display = state.view==="month" ? "" : "none";
    document.getElementById("view-planner").style.display = state.view==="planner" ? "" : "none";
    if(state.view==="planner") renderPlanner();
  });

  /* ---------- global settings panel ---------- */
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsBody = document.getElementById("settingsBody");
  settingsBtn.addEventListener("click", function(){ settingsBody.classList.toggle("open"); });

  var weekStartSel = document.getElementById("weekStartSel");
  var themeSel = document.getElementById("themeSel");
  weekStartSel.value = String(state.settings.weekStart);
  themeSel.value = state.settings.theme;
  weekStartSel.addEventListener("change", function(){
    state.settings.weekStart = Number(weekStartSel.value);
    saveSettings();
    renderMonth();
    renderPlanner();
  });
  themeSel.addEventListener("change", function(){
    state.settings.theme = themeSel.value;
    saveSettings();
    applyTheme();
  });

  /* ================= MONTH VIEW ================= */
  var mTitle = document.getElementById("mTitle");
  var mWeekdays = document.getElementById("mWeekdays");
  var mGrid = document.getElementById("mGrid");

  document.getElementById("mPrev").addEventListener("click", function(){
    state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()-1, 1);
    renderMonth();
  });
  document.getElementById("mNext").addEventListener("click", function(){
    state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()+1, 1);
    renderMonth();
  });
  document.getElementById("mToday").addEventListener("click", function(){
    state.monthCursor = new Date(today.getFullYear(), today.getMonth(), 1);
    renderMonth();
  });

  function renderMonth(){
    var y = state.monthCursor.getFullYear(), m = state.monthCursor.getMonth();
    mTitle.textContent = MONTHNAMES[m] + " " + y;

    var labels = orderedWeekdayLabels(state.settings.weekStart);
    mWeekdays.innerHTML = labels.map(function(l){ return "<div>"+l+"</div>"; }).join("");

    var firstOfMonth = new Date(y,m,1);
    var firstCellOffset = weekdayOffset(firstOfMonth.getDay(), state.settings.weekStart);
    var gridStart = addDays(firstOfMonth, -firstCellOffset);

    var daysInMonth = new Date(y,m+1,0).getDate();
    var totalCells = Math.ceil((firstCellOffset + daysInMonth) / 7) * 7;

    var html = "";
    for(var i=0;i<totalCells;i++){
      var cellDate = addDays(gridStart, i);
      var outside = cellDate.getMonth() !== m;
      var isToday = isSameDay(cellDate, today);
      var dow = cellDate.getDay();
      var weekend = dow===0 || dow===6;
      var cls = "day-cell";
      if(outside) cls += " outside";
      if(isToday) cls += " today";
      if(weekend) cls += " weekend";
      html += '<div class="'+cls+'">'+cellDate.getDate()+'</div>';
    }
    mGrid.innerHTML = html;
  }

  /* ================= PLANNER (1000-day) ================= */
  var startDateInp = document.getElementById("startDateInp");
  var totalDaysInp = document.getElementById("totalDaysInp");
  var gestationInp = document.getElementById("gestationInp");
  var lactationInp = document.getElementById("lactationInp");
  var wsiInp = document.getElementById("wsiInp");
  var plannerCfgBtn = document.getElementById("plannerCfgBtn");
  var plannerCfgBody = document.getElementById("plannerCfgBody");

  plannerCfgBtn.addEventListener("click", function(){ plannerCfgBody.classList.toggle("open"); });

  startDateInp.value = state.settings.startDate;
  totalDaysInp.value = state.settings.totalDays;
  gestationInp.value = state.settings.gestation;
  lactationInp.value = state.settings.lactation;
  wsiInp.value = state.settings.wsi;

  function onPlannerCfgChange(){
    state.settings.startDate = startDateInp.value || state.settings.startDate;
    state.settings.totalDays = clamp(Number(totalDaysInp.value)||1000, 100, 1500);
    state.settings.gestation = clamp(Number(gestationInp.value)||114, 90, 130);
    state.settings.lactation = clamp(Number(lactationInp.value)||21, 14, 35);
    state.settings.wsi = clamp(Number(wsiInp.value)||5, 3, 14);
    saveSettings();
    state.plannerPage = 0;
    renderPlanner();
  }
  [startDateInp,totalDaysInp,gestationInp,lactationInp,wsiInp].forEach(function(el){
    el.addEventListener("change", onPlannerCfgChange);
  });

  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }

  /* batches */
  var colorPicksEl = document.getElementById("colorPicks");
  var selectedColor = COLORS[0];
  COLORS.forEach(function(c, idx){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "color-pick" + (idx===0 ? " selected" : "");
    b.style.background = c;
    b.addEventListener("click", function(){
      selectedColor = c;
      Array.prototype.forEach.call(colorPicksEl.children, function(ch){ ch.classList.remove("selected"); });
      b.classList.add("selected");
    });
    colorPicksEl.appendChild(b);
  });

  var batchLabelInp = document.getElementById("batchLabel");
  var batchDateInp = document.getElementById("batchDate");
  batchDateInp.value = isoDate(today);

  document.getElementById("addBatchBtn").addEventListener("click", function(){
    var label = (batchLabelInp.value||"").trim();
    if(!label) label = "Batch " + (state.batches.length+1);
    var dateVal = batchDateInp.value;
    if(!dateVal) return;
    state.batches.push({
      id: "b" + Date.now() + Math.floor(Math.random()*1000),
      label: label,
      color: selectedColor,
      serviceDate: dateVal
    });
    saveBatches();
    batchLabelInp.value = "";
    renderBatchList();
    renderPlanner();
  });

  function removeBatch(id){
    state.batches = state.batches.filter(function(b){ return b.id !== id; });
    saveBatches();
    renderBatchList();
    renderPlanner();
  }

  function renderBatchList(){
    var el = document.getElementById("batchList");
    if(state.batches.length===0){
      el.innerHTML = '<div style="color:var(--muted);font-size:13px;">No batches yet — add a first-service date below to project farrowing, weaning, and repeat cycles across the planner.</div>';
      return;
    }
    el.innerHTML = state.batches.map(function(b){
      var sd = parseISO(b.serviceDate);
      var fd = addDays(sd, state.settings.gestation);
      var wd = addDays(fd, state.settings.lactation);
      return '<div class="batch-row">'
        + '<span class="swatch" style="background:'+b.color+'"></span>'
        + '<span class="label">'+escapeHtml(b.label)+'</span>'
        + '<span class="dates">S '+fmtShort(sd)+' &nbsp;·&nbsp; F '+fmtShort(fd)+' &nbsp;·&nbsp; W '+fmtShort(wd)+'</span>'
        + '<button data-id="'+b.id+'" class="removeBatchBtn ghost">Remove</button>'
        + '</div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".removeBatchBtn"), function(btn){
      btn.addEventListener("click", function(){ removeBatch(btn.getAttribute("data-id")); });
    });
  }

  function fmtShort(dt){ return dt.getDate() + " " + MONTHSHORT[dt.getMonth()]; }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* compute events (S/F/W) for a batch across the whole planner range, chaining cycles */
  function batchEventsInRange(batch, rangeStart, rangeDaysCount){
    var events = [];
    var rangeEnd = addDays(rangeStart, rangeDaysCount-1);
    var cursor = parseISO(batch.serviceDate);
    var safety = 0;
    // if first service is after range end, nothing to show
    while(cursor.getTime() <= rangeEnd.getTime() && safety < 60){
      safety++;
      var farrow = addDays(cursor, state.settings.gestation);
      var wean = addDays(farrow, state.settings.lactation);
      if(cursor.getTime() >= rangeStart.getTime() && cursor.getTime() <= rangeEnd.getTime()){
        events.push({date:cursor, type:"S", batch:batch});
      }
      if(farrow.getTime() >= rangeStart.getTime() && farrow.getTime() <= rangeEnd.getTime()){
        events.push({date:farrow, type:"F", batch:batch});
      }
      if(wean.getTime() >= rangeStart.getTime() && wean.getTime() <= rangeEnd.getTime()){
        events.push({date:wean, type:"W", batch:batch});
      }
      cursor = addDays(wean, state.settings.wsi);
    }
    return events;
  }

  function eventTypeColor(type){
    if(type==="S") return "var(--accent)";
    if(type==="F") return "var(--danger)";
    return "var(--amber)"; // W
  }

  var pWeekdays = document.getElementById("pWeekdays");
  var pGrid = document.getElementById("pGrid");
  var pProgress = document.getElementById("pProgress");

  document.getElementById("pPrev").addEventListener("click", function(){
    state.plannerPage = Math.max(0, state.plannerPage-1);
    renderPlanner();
  });
  document.getElementById("pNext").addEventListener("click", function(){
    state.plannerPage = state.plannerPage+1;
    renderPlanner();
  });
  document.getElementById("pToday").addEventListener("click", function(){
    jumpToDayNumber(currentDayNumber());
  });
  document.getElementById("jumpForm").addEventListener("submit", function(e){
    e.preventDefault();
    var n = Number(document.getElementById("jumpInp").value);
    if(n) jumpToDayNumber(n);
  });

  function currentDayNumber(){
    var start = parseISO(state.settings.startDate);
    return daysBetween(start, today) + 1; // 1-indexed
  }
  function jumpToDayNumber(n){
    n = clamp(n, 1, state.settings.totalDays);
    var perPage = state.weeksPerPage*7;
    state.plannerPage = Math.floor((n-1)/perPage);
    renderPlanner();
  }

  function renderPlanner(){
    var labels = orderedWeekdayLabels(state.settings.weekStart);
    pWeekdays.innerHTML = "<div></div>" + labels.map(function(l){ return "<div>"+l+"</div>"; }).join("");

    var start = parseISO(state.settings.startDate);
    var totalDays = state.settings.totalDays;
    var perPage = state.weeksPerPage*7;
    var maxPage = Math.max(0, Math.ceil(totalDays/perPage)-1);
    state.plannerPage = clamp(state.plannerPage, 0, maxPage);

    // align first row of the whole planner to the weekday of "start", per weekStart setting
    var startOffset = weekdayOffset(start.getDay(), state.settings.weekStart);
    var pageFirstIndex = state.plannerPage*perPage; // index within the aligned grid (0 = startOffset back from start)
    var gridOrigin = addDays(start, -startOffset);

    // gather events for the whole range once, index by ISO date
    var eventsByDate = {};
    state.batches.forEach(function(b){
      batchEventsInRange(b, start, totalDays).forEach(function(ev){
        var key = isoDate(ev.date);
        if(!eventsByDate[key]) eventsByDate[key] = [];
        eventsByDate[key].push(ev);
      });
    });

    var rowsHtml = "";
    for(var w=0; w<state.weeksPerPage; w++){
      rowsHtml += '<div class="week-row">';
      var weekFirstIdx = pageFirstIndex + w*7;
      var weekDate = addDays(gridOrigin, weekFirstIdx);
      rowsHtml += '<div class="weeklabel">'+weekLabel(weekDate)+'</div>';
      for(var c=0;c<7;c++){
        var idx = weekFirstIdx + c;
        var cellDate = addDays(gridOrigin, idx);
        var dayNumber = daysBetween(start, cellDate) + 1;
        var inRange = dayNumber>=1 && dayNumber<=totalDays;
        var isToday = isSameDay(cellDate, today);
        var isFirstOfMonth = cellDate.getDate()===1;
        var cls = "pcell" + (isToday?" today":"") + (inRange?"":" out-of-range");
        var marksHtml = "";
        var key = isoDate(cellDate);
        if(eventsByDate[key]){
          marksHtml = '<div class="marks">' + eventsByDate[key].map(function(ev){
            return '<span class="mark" style="background:'+ev.batch.color+'" title="'+escapeHtml(ev.batch.label)+' · '+eventLabel(ev.type)+'">'+ev.type+'</span>';
          }).join("") + '</div>';
        }
        rowsHtml += '<div class="'+cls+'">'
          + '<div class="daynum">'+(inRange?("Day "+dayNumber):"")+'</div>'
          + '<div class="datenum">'+cellDate.getDate()+(isFirstOfMonth?(' <span class="monthtag">'+MONTHSHORT[cellDate.getMonth()]+'</span>'):'')+'</div>'
          + marksHtml
          + '</div>';
      }
      rowsHtml += '</div>';
    }
    pGrid.innerHTML = rowsHtml;

    var rangeStartN = pageFirstIndex+1, rangeEndN = Math.min(pageFirstIndex+perPage, totalDays);
    pProgress.textContent = "Days " + Math.max(1,rangeStartN) + "–" + Math.max(rangeStartN,rangeEndN) + " of " + totalDays;
  }

  function weekLabel(weekDate){
    return "W" + (Math.floor(daysBetween(startOfYear(weekDate), weekDate)/7)+1);
  }
  function eventLabel(t){
    if(t==="S") return "Service";
    if(t==="F") return "Farrowing";
    return "Weaning";
  }

  /* ---------- init ---------- */
  applyTheme();
  renderMonth();
  renderBatchList();
  renderPlanner();

})();
</script>
</body>
</html>
